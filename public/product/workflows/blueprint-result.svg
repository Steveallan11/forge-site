<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#0A0C0B"/>
<text x="60" y="70" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="34" font-weight="900" text-anchor="start">FORGE</text><circle cx="190" cy="58" r="7" fill="#FF5A2F"/>
<text x="60" y="115" fill="#FF5A2F" font-family="Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">YOUR FIRST FORGE</text>
<text x="60" y="175" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="38" font-weight="850" text-anchor="start">A simpler, stronger way to run your roofing business.</text>
<text x="60" y="214" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Based on your answers, here’s the operating flow we’d look at first.</text>
<rect x="1040" y="58" width="500" height="160" rx="14" fill="#151817" stroke="rgba(241,238,231,.10)"/>
<text x="1065" y="90" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start">YOUR SETUP</text>
<text x="1065" y="126" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start">Roofing · 11–25 people</text>
<text x="1065" y="160" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">WhatsApp · Email · Xero · Spreadsheets</text>
<rect x="1065" y="176" width="230" height="30" rx="15" fill="#FF5A2F" stroke="rgba(241,238,231,.08)"/><text x="1180" y="196" fill="#0A0C0B" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MAIN PAIN · QUOTING</text>
<text x="60" y="290" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start">YOUR ROOFING OPERATING FLOW</text>
