E7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">Findings</text><text x="522" y="445" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Review issues</text><path d="M643 450 L657 450" stroke="#FF5A2F" stroke-width="3"/><rect x="658" y="325" width="136" height="250" rx="12" fill="#101211" stroke="rgba(241,238,231,.10)"/><text x="674" y="365" fill="#FF5A2F" font-family="Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start">05</text><text x="674" y="405" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">Report</text><text x="674" y="445" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Generate report</text><path d="M795 450 L809 450" stroke="#FF5A2F" stroke-width="3"/><rect x="810" y="325" width="136" height="250" rx="12" fill="#101211" stroke="rgba(241,238,231,.10)"/><text x="826" y="365" fill="#FF5A2F" font-family="Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start">06</text><text x="826" y="405" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">Quote</text><text x="826" y="445" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Price scope</text><path d="M947 450 L961 450" stroke="#FF5A2F" stroke-width="3"/><rect x="962" y="325" width="136" height="250" rx="12" fill="#101211" stroke="rgba(241,238,231,.10)"/><text x="978" y="365" fill="#FF5A2F" font-family="Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start">07</text><text x="978" y="405" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">Follow-up</text><text x="978" y="445" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Track next step</text><path d="M1099 450 L1113 450" stroke="#FF5A2F" stroke-width="3"/><rect x="1114" y="325" width="136" height="250" rx="12" fill="#101211" stroke="rgba(241,238,231,.10)"/><text x="1130" y="365" fill="#FF5A2F" font-family="Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start">08</text><text x="1130" y="405" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">Job</text><text x="1130" y="445" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Schedule work</text><path d="M1251 450 L1265 450" stroke="#FF5A2F" stroke-width="3"/><rect x="1266" y="325" width="136" height="250" rx="12" fill="#101211" stroke="rgba(241,238,231,.10)"/><text x="1282" y="365" fill="#FF5A2F" font-family="Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start">09</text><text x="1282" y="405" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">Invoice</text><text x="1282" y="445" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Prepare invoice</text><path d="M1403 450 L1417 450" stroke="#FF5A2F" stroke-width="3"/><rect x="1418" y="325" width="136" height="250" rx="12" fill="#101211" stroke="rgba(241,238,231,.10)"/><text x="1434" y="365" fill="#FF5A2F" font-family="Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start">10</text><text x="1434" y="405" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">Money</text><text x="1434" y="445" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">See the cash</text>
<text x="60" y="645" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start">3 THINGS WE’D LOOK AT FIRST</text>
<rect x="60" y="680" width="470" height="180" rx="12" fill="#151817" stroke="rgba(241,238,231,.10)"/><circle cx="94" cy="716" r="16" fill="#FF5A2F"/><text x="94" y="722" fill="#0A0C0B" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle">1</text><text x="122" y="720" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start">Speed up and standardise quoting</text><text x="122" y="750" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start">Survey → report → quote with less re-entry.</text><rect x="122" y="795" width="150" height="30" rx="15" fill="#FF5A2F" stroke="rgba(241,238,231,.08)"/><text x="197" y="815" fill="#0A0C0B" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BIGGEST IMPACT</text><rect x="560" y="680" width="470" height="180" rx="12" fill="#151817" stroke="rgba(241,238,231,.10)"/><circle cx="594" cy="716" r="16" fill="#FF5A2F"/><text x="594" y="722" fill="#0A0C0B" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle">2</text><text x="622" y="720" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start">Give information somewhere to belong</text><text x="622" y="750" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start">Keep WhatsApp, Email and Xero; carry context forward.</text><rect x="622" y="795" width="150" height="30" rx="15" fill="#101211" stroke="rgba(241,238,231,.08)"/><text x="697" y="815" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FOUNDATION</text><rect x="1060" y="680" width="470" height="180" rx="12" fill="#151817" stroke="rgba(241,238,231,.10)"/><circle cx="1094" cy="716" r="16" fill="#FF5A2F"/><text x="1094" y="722" fill="#0A0C0B" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle">3</text><text x="1122" y="720" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start">Automate follow-up and tracking</text><text x="1122" y="750" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start">Surface quotes, missing details and money that need action.</text><rect x="1122" y="795" width="150" height="30" rx="15" fill="#101211" stroke="rgba(241,238,231,.08)"/><text x="1197" y="815" fill="#A3A7A3" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LESS CHASING</text>
<text x="60" y="930" fill="#F1EEE7" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start">A PROVEN FOUNDATION. BUILT AROUND YOUR BUSINESS.</text>
</svg>